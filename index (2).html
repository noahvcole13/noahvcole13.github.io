<!DOCTYPE html>
<!-- The attribute lang="en" in an HTML document tells browsers and
 screen readers that the content is in English, which helps with
 pronunciation, translation, and language-specific formatting.-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Welcome to My First Webpage!</h1>

    <h2>About Me</h2>
    <p>This is my first attempt at using CSS to style a web page.</p>
    <img src="sample-image.jpg" alt="A picture I like" />

    <ul>
      <li>I enjoy hiking in the outdoors</li>
      <li>I love listening to music</li>
      <li>I like playing video games</li>
    </ul>

    <a href="https://www.nasa.gov">NASA - Exploring the Universe</a>
  </body>
</html>
